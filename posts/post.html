<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedas Terasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="post-page">
  <header class="site-header"><div class="shell header-inner"><a class="brand" href="../"><span class="brand-mark">PT</span><span>Pedas Terasi</span></a><p class="header-note">Notes on learning &amp; making things</p></div></header>
  <main id="post"></main>
  <footer class="site-footer"><div class="shell footer-inner"><p>Pedas Terasi</p><p>Made slowly, with curiosity. © 2026</p></div></footer>
  <script src="../posts-data.js"></script>
  <script>
    const slug = new URLSearchParams(window.location.search).get("post");
    const post = posts.find((entry) => entry.slug === slug);
    const renderBlock = (block) => {
      if (block.type === "heading") return `<h2>${block.text}</h2>`;
      if (block.type === "quote") return `<blockquote><p>${block.text}</p></blockquote>`;
      return `<p>${block.text}</p>`;
    };
    if (!post) {
      document.title = "Note not found — Pedas Terasi";
      document.querySelector("#post").innerHTML = `<section class="article empty-note"><h1>That note isn’t here yet.</h1><a class="back-link" href="../">← Back to all notes</a></section>`;
    } else {
      document.title = `${post.title} — Pedas Terasi`;
      document.querySelector("#post").innerHTML = `<header class="post-header"><p class="post-meta"><time datetime="${post.date}">${post.dateLabel}</time><span>•</span>${post.category}</p><h1>${post.title}</h1><p class="post-deck">${post.summary}</p></header><article class="article">${post.content.map(renderBlock).join("")}<a class="back-link" href="../">← Back to all notes</a></article>`;
    }
  </script>
</body>
</html>
