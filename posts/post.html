<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedas Terasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="post-page"><a class="skip-link" href="#post">Skip to note</a>
  <header class="site-header"><div class="shell header-inner"><a class="brand" href="../"><span class="brand-mark">PT</span><span>Pedas Terasi</span></a><nav class="site-nav" aria-label="Main navigation"><a href="../">Home</a><a href="../#notes">All notes</a><a href="../#topics">Topics</a><a class="write-link" href="../new-post.html">Post maker</a></nav></div></header>
  <main id="post" tabindex="-1"></main>
  <footer class="site-footer"><div class="shell footer-inner"><p>Pedas Terasi</p><p>Made slowly, with curiosity. © 2026</p></div></footer>
  <script src="../posts-data.js"></script>
  <script>
    const slug = new URLSearchParams(window.location.search).get("post");
    const post = posts.find((entry) => entry.slug === slug);
    const renderPostNavigation = () => {
      const currentIndex = posts.findIndex((entry) => entry.slug === post.slug);
      const newer = posts[currentIndex - 1];
      const older = posts[currentIndex + 1];
      const item = (entry, label) => entry ? `<a href="post.html?post=${encodeURIComponent(entry.slug)}"><span>${label}</span>${entry.title}</a>` : `<span class="nav-placeholder"></span>`;
      return `<nav class="post-navigation" aria-label="More notes">${item(newer, "Newer note")} ${item(older, "Older note")}</nav>`;
    };
    const renderBlock = (block) => {
      if (block.type === "heading") return `<h2>${block.text}</h2>`;
      if (block.type === "quote") return `<blockquote><p>${block.text}</p></blockquote>`;
      if (block.type === "link") return `<p class="article-link"><a href="${block.url}" target="_blank" rel="noopener noreferrer">${block.label} <span aria-hidden="true">↗</span></a></p>`;
      if (block.type === "unity") return `<figure class="unity-demo"><iframe src="${block.src}" title="${block.title || "Playable Unity game"}" loading="lazy">Your browser does not support embedded builds.</iframe>${block.caption ? `<figcaption>${block.caption}</figcaption>` : ""}</figure>`;
      return `<p>${block.text}</p>`;
    };
    if (!post) {
      document.title = "Note not found — Pedas Terasi";
      document.querySelector("#post").innerHTML = `<section class="article empty-note"><h1>That note isn’t here yet.</h1><a class="back-link" href="../">← Back to all notes</a></section>`;
    } else {
      document.title = `${post.title} — Pedas Terasi`;
      document.querySelector("#post").innerHTML = `<header class="post-header"><p class="post-meta"><time datetime="${post.date}">${post.dateLabel}</time></p><div class="post-tags post-header-tags">${post.tags.map((tag) => `<span>${tag}</span>`).join("")}</div><h1>${post.title}</h1><p class="post-deck">${post.summary}</p></header><article class="article">${post.content.map(renderBlock).join("")}<a class="back-link" href="../">← Back to all notes</a>${renderPostNavigation()}</article>`;
    }
  </script>
</body>
</html>
